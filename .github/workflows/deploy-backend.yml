name: Deploy PocketBase Config

on:
  push:
    branches: [main]
    paths:
      - 'matenweekend_config/pocketbase_config/**'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy hooks to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: 46.62.164.62
          REMOTE_USER: root
          SOURCE: matenweekend_config/pocketbase_config/pb_hooks/
          TARGET: /opt/matenweekend/pb_hooks/

      - name: Deploy migrations to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: 46.62.164.62
          REMOTE_USER: root
          SOURCE: matenweekend_config/pocketbase_config/pb_migrations/
          TARGET: /opt/matenweekend/pb_migrations/
          SCRIPT_AFTER: |
            cd /opt/matenweekend
            docker compose restart pocketbase
            echo "PocketBase config deployed and restarted successfully"
